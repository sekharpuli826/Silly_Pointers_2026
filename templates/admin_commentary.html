{% extends "base.html" %}
{% block content %}

<div class="page-title">Add Commentary — {{ match_id }}</div>

<div class="card">
    <form method="POST">
        <label>Commentary Line:</label>
        <textarea name="text" rows="3" placeholder="Example: 'Brilliant yorker! Middle stump uprooted.'"></textarea>
        <button type="submit" class="button">Add Commentary</button>
    </form>
</div>

<div class="card">
    <h2>Existing Commentary</h2>
    {% if feed %}
        <ul>
        {% for line in feed %}
            <li>{{ line }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No commentary added yet.</p>
    {% endif %}
</div>

{% endblock %}
