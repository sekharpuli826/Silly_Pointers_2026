{% extends "base.html" %}
{% block content %}

<h1>Add Commentary - {{ match_id }}</h1>

<form method="POST">
    <textarea name="text" rows="3" cols="80"></textarea><br><br>
    <button type="submit">Add</button>
</form>

<h2>Existing Commentary</h2>
<ul>
    {% for line in feed %}
    <li>{{ line }}</li>
    {% endfor %}
</ul>

{% endblock %}
