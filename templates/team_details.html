{% extends "base.html" %}
{% block content %}

<div class="page-title">{{ team }}</div>

<div class="card">
    <img src="/static/logos/{{ logo }}" alt="{{ team }} Logo" style="width:150px; display:block; margin:auto;">
    <h2 style="text-align:center;">Captain: {{ captain }}</h2>
</div>

<div class="card">
    <h2>Players</h2>
    <table>
        <tr>
            <th>Player</th>
            <th>Runs</th>
            <th>Wickets</th>
            <th>Points</th>
        </tr>
        {% for p in players %}
        <tr>
            <td>{{ p }}</td>
            <td>{{ stats[p].runs }}</td>
            <td>{{ stats[p].wickets }}</td>
            <td>{{ stats[p].points }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
