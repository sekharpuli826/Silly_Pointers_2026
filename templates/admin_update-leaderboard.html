{% extends "base.html" %}
{% block content %}

<div class="page-title">Update Player Leaderboard</div>

<div class="card">
    <form method="POST">

        <label>Player:</label>
        <select name="player" required>
            {% for name, stats in player_stats.items() %}
                <option value="{{ name }}">{{ name }} ({{ stats.team }})</option>
            {% endfor %}
        </select>

        <label>Team:</label>
        <select name="team" required>
            {% for t in points_table.keys() %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Runs:</label>
        <input type="number" name="runs" required>

        <label>Wickets:</label>
        <input type="number" name="wickets" required>

        <label>Points:</label>
        <input type="number" name="points" required>

        <button type="submit" class="button">Update Leaderboard</button>
    </form>
</div>

{% endblock %}
