{% extends "base.html" %}
{% block content %}

<div class="page-title">Update Points Table</div>

<div class="card">
    <form method="POST">

        <label>Team:</label>
        <select name="team" required>
            {% for t in points_table.keys() %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Played:</label>
        <input type="number" name="played" required>

        <label>Won:</label>
        <input type="number" name="won" required>

        <label>Lost:</label>
        <input type="number" name="lost" required>

        <label>Points:</label>
        <input type="number" name="points" required>

        <label>NRR:</label>
        <input type="text" name="nrr" placeholder="e.g., 0.456" required>

        <button type="submit" class="button">Update Points</button>
    </form>
</div>

{% endblock %}
