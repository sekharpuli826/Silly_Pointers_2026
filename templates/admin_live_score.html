{% extends "base.html" %}
{% block content %}

<div class="page-title">Update Live Score</div>

<div class="card">
    <form method="POST">

        <label>Batting Team:</label>
        <select name="batting_team" required>
            {% for t in live_score.keys() %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Runs:</label>
        <input type="number" name="runs" required>

        <label>Wickets:</label>
        <input type="number" name="wickets" required>

        <label>Overs:</label>
        <input type="text" name="overs" placeholder="e.g., 12.3" required>

        <label>Bowling Team:</label>
        <select name="bowling_team" required>
            {% for t in live_score.keys() %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Last Update:</label>
        <input type="text" name="last_update" placeholder="Optional">

        <hr>

        <h3>Auto‑Update Player Stats</h3>

        <label>Striker:</label>
        <select name="striker">
            {% for name, s in player_stats.items() %}
                <option value="{{ name }}">{{ name }} ({{ s.team }})</option>
            {% endfor %}
        </select>

        <label>Bowler:</label>
        <select name="bowler">
            {% for name, s in player_stats.items() %}
                <option value="{{ name }}">{{ name }} ({{ s.team }})</option>
            {% endfor %}
        </select>

        <label>Runs Scored:</label>
        <input type="number" name="runs_scored" value="0">

        <label>Wicket Taken:</label>
        <select name="wicket_taken">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit" class="button">Update Live Score</button>
    </form>
</div>

{% endblock %}
