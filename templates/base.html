<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Silly Pointers 2026 🏏" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
</head>
<body>

    <!-- Top Banner -->
    <div class="banner">
        <h1>Silly Pointers 2026 🏏</h1>
        <p>Cricket Tournament Dashboard</p>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/teams">Teams</a>
        <a href="/matches">Matches</a>
        <a href="/points">Points Table</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/live">Live Score</a>
        <a href="/admin">Admin Panel</a>
    </nav>

    <!-- Page Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        © 2026 Silly Pointers Cricket League
    </footer>

</body>
</html>
