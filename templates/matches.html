{% extends "base.html" %}
{% block content %}

<div class="page-title">Matches</div>

{% for m in matches %}
<div class="card">
    <h2>{{ m.day }} — {{ m.date }}</h2>
    <p><strong>Time:</strong> {{ m.time }}</p>
    <p><strong>{{ m.team1 }}</strong> vs <strong>{{ m.team2 }}</strong></p>

    {% if m.note %}
        <p><strong>Note:</strong> {{ m.note }}</p>
    {% endif %}
</div>
{% endfor %}

{% endblock %}
