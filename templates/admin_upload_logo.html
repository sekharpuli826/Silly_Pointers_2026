{% extends "base.html" %}
{% block content %}

<div class="page-title">Upload Team Logo</div>

<div class="card">
    <form method="POST" enctype="multipart/form-data">

        <label>Select Team:</label>
        <select name="team" required>
            {% for t in teams %}
                <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Choose Logo File (.jpeg):</label>
        <input type="file" name="logo" accept="image/jpeg" required>

        <button type="submit" class="button">Upload Logo</button>
    </form>
</div>

{% endblock %}
