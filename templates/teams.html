{% extends "base.html" %}
{% block content %}

<div class="page-title">Teams</div>

<div class="team-container">
    {% for team in teams %}
    <div class="team-card">
        <img src="/static/logos/{{ team.logo }}" alt="{{ team.name }} Logo">
        <h3>{{ team.name }}</h3>
        <a class="button" href="/teams/{{ team.name }}">View Team</a>
    </div>
    {% endfor %}
</div>

{% endblock %}
