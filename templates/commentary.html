{% extends "base.html" %}
{% block content %}

<div class="page-title">Commentary — {{ match_id }}</div>

<div class="card">
    {% if feed %}
        <ul>
        {% for line in feed %}
            <li>{{ line }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No commentary added yet.</p>
    {% endif %}
</div>

{% endblock %}
